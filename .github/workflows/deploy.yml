name: Deploy

on:
  push:
    branches: [main]
  # Redeploy a known-good tag without pushing a commit.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy'
        required: false
        default: 'main'

# One deploy at a time, and never cancel one mid-flight: it may be between the
# migration and the restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The commit SHA is the tag the droplet pins to, so a rollback is exact.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Open an SSH session to the droplet
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart
        env:
          HOST: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
          APP_DIR: ${{ secrets.DROPLET_PATH }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$HOST" bash -euo pipefail <<REMOTE
            cd "$APP_DIR"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pin to this commit so a restart later cannot silently pick up something
            # newer, and so a rollback is one line.
            if grep -q '^ADMIN_IMAGE=' .env; then
              sed -i "s|^ADMIN_IMAGE=.*|ADMIN_IMAGE=$IMAGE|" .env
            else
              echo "ADMIN_IMAGE=$IMAGE" >> .env
            fi

            docker compose -f docker-compose.prod.yml pull
            # The migrate service runs to completion before web and worker restart.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f --filter "until=168h"
          REMOTE

      - name: Wait for the service to report ready
        env:
          HOST: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
        run: |
          ssh "$HOST" bash -euo pipefail <<'REMOTE'
            for i in $(seq 1 30); do
              body=$(docker exec admin_core_web curl -fsS http://127.0.0.1:3001/health/ready || true)
              case "$body" in
                *'"status":"ready"'*) echo "ready: $body"; exit 0 ;;
              esac
              echo "attempt $i: ${body:-no response}"
              sleep 5
            done
            echo "service did not become ready"
            docker compose -f docker-compose.prod.yml logs --tail 80 admin-core
            exit 1
          REMOTE

      - name: Report the deployed revision
        if: always()
        run: echo "Deployed ${{ github.sha }} to ${{ secrets.DROPLET_HOST }}"
