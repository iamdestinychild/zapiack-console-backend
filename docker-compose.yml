# Local dependencies for admin-core.
#
# Container names and host ports are deliberately distinct from the zapiack-backend
# stack, which uses zapiack_postgres / zapiack_redis on 5432 and 6379. The admin
# console is a separate service and has to be able to run beside the product, not
# instead of it.

services:
  postgres:
    image: postgres:17
    container_name: zapiack_admin_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # The Admin DB. The Zapiack mirror is created alongside it by the init script.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only on first init of an empty volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - zapiack_admin_network

  redis:
    image: redis:7-alpine
    container_name: zapiack_admin_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - zapiack_admin_network

volumes:
  postgres_data:
  redis_data:

networks:
  zapiack_admin_network:
    driver: bridge
